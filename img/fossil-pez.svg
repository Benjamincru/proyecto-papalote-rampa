<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fondo roca caliza -->
  <rect width="400" height="250" fill="#D4B896"/>
  <!-- Textura de roca -->
  <ellipse cx="80" cy="60" rx="55" ry="20" fill="#C4A880" opacity="0.5"/>
  <ellipse cx="320" cy="190" rx="70" ry="25" fill="#C4A880" opacity="0.5"/>
  <ellipse cx="200" cy="30" rx="90" ry="15" fill="#BFA070" opacity="0.4"/>
  
  <!-- Espina dorsal del pez -->
  <path d="M 80 125 C 140 118, 220 118, 300 122 C 320 123, 335 126, 345 130" stroke="#5C3D1E" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Costillas -->
  <line x1="140" y1="120" x2="135" y2="145" stroke="#5C3D1E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="160" y1="119" x2="155" y2="148" stroke="#5C3D1E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="180" y1="119" x2="175" y2="148" stroke="#5C3D1E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="119" x2="198" y2="148" stroke="#5C3D1E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="220" y1="119" x2="220" y2="147" stroke="#5C3D1E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="240" y1="119" x2="242" y2="146" stroke="#5C3D1E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="260" y1="120" x2="263" y2="143" stroke="#5C3D1E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="280" y1="121" x2="283" y2="140" stroke="#5C3D1E" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Cráneo -->
  <ellipse cx="100" cy="123" rx="22" ry="18" fill="none" stroke="#5C3D1E" stroke-width="3"/>
  <circle cx="94" cy="117" r="4" fill="#5C3D1E"/>
  <!-- Mandíbula -->
  <path d="M 84 128 C 90 136, 108 136, 118 130" stroke="#5C3D1E" stroke-width="2.5" fill="none"/>
  
  <!-- Aleta dorsal -->
  <path d="M 160 119 L 165 90 L 200 85 L 230 94 L 240 119" stroke="#5C3D1E" stroke-width="2" fill="#C9A87B" fill-opacity="0.5"/>
  
  <!-- Aleta caudal (cola) -->
  <path d="M 340 126 L 370 100 L 375 130 L 370 155 Z" stroke="#5C3D1E" stroke-width="2" fill="#C9A87B" fill-opacity="0.5"/>
  
  <!-- Aletas pectorales -->
  <path d="M 150 122 L 145 155 L 170 150 Z" stroke="#5C3D1E" stroke-width="1.5" fill="#C9A87B" fill-opacity="0.5"/>
  
  <!-- Label decorativo -->
  <text x="200" y="230" text-anchor="middle" font-family="serif" font-size="14" fill="#7A5230" opacity="0.8">Xiphactinus sp. — Vallecillo, N.L.</text>
</svg>
